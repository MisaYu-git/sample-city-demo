# main ブランチに push すると、自動でビルドして GitHub Pages に公開する。
# リポジトリが公開（Public）なら、GitHub Actions も Pages も無料。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # https://<ユーザー名>.github.io/<リポジトリ名>/ で公開されるため、サブパスを指定する
          VITE_BASE: /${{ github.event.repository.name }}/
          # サーバー設定なしで、画面のURLを直接開いても動くようにする
          VITE_ROUTER: hash
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
